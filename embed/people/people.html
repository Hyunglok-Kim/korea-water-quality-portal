<!--
  hydroai.net People page, shown in a cleaner layout by one block.
  A title with the motto, the group photographs in a row (a click enlarges one), then everyone on one page:
  the first group (the PI) as a wide card with education, experience and, folded, services; the others as cards
  with their research interests. Whoever has more to show (publications, awards ...) opens as a profile.
  A group named Alumni is shown briefly: each name (without Mr. or Ms.) and the role line, where they are now.

  Where it goes: one Webflow Code Embed on the People page, right after the navigation bar.
  It has no content of its own. The people are read from the CMS lists in the page's five tabs, the pictures
  and the motto from the block above the tabs; those stay on the page, are edited in Webflow as before, and are
  not shown while this block runs. Without scripts, in a browser from before 2022, or if nobody can be read
  from the page, the page shows as it always did.

  To change it:
    a person, a group, their order    the People collection and the tabs in Webflow
    the photographs, the motto        the pictures and the line above the tabs in Webflow
    the small title, the title        the markup below
    the words on the buttons          T in the script
  How a person's text is read: a short line in bold is a heading; "Research Interests" goes on the card; a line
  beginning "(2024)", "[1]", "1." or a bullet has that mark set apart; a link named "Main Project Link" becomes
  the card's project link; a link that is "TBD" or "#" is left out.
-->

    /* the motto: its clauses one under the other when it is a few short ones, as "In Essentials Unity, ..." is */
    var bits = data.motto.split(/,\s+/);
    if (bits.length > 1 && bits.length < 5 && bits.every(b => b.length <= 34)) bits.forEach((b, i) => motto.appendChild(el('span', '', b + (i < bits.length - 1 ? ', ' : ''))));
    else motto.textContent = data.motto;

    /* the photographs */
    picsEl.style.setProperty('--n', Math.min(4, data.pics.length || 1));
    data.pics.forEach((ph, i) => {
      var li = el('li'), b = el('button', 'hp-pic'), im = el('img');
      b.type = 'button'; b.setAttribute('aria-label', 'Enlarge group photograph ' + (i + 1) + ' of ' + data.pics.length);
      im.alt = ''; im.decoding = 'async';
      if (ph.srcset) { im.sizes = '(max-width: 759px) 46vw, 320px'; im.srcset = ph.srcset; }
      im.src = ph.src; b.appendChild(im); li.appendChild(b); picsEl.appendChild(li);
      b.addEventListener('click', () => light(i));
    });

    /* the groups and their chips: the first group wide, a group named Alumni briefly, the others as cards */
    function chip(key, label) {
      var a = el('a', 'hp-chip', label); a.href = key ? '#' + key : here.pathname + here.search; a.setAttribute('data-g', key);
      nav.appendChild(a);
    }
    chip('', T.all);
    data.groups.forEach((g, gi) => {
      var short = gi && /alumni/i.test(g.label), s = el('section', 'hp-group' + (gi && g.people.length === 1 ? ' is-solo' : '')), h = el('h2', gi ? 'hp-gh' : 'hp-vh', g.label), grid = el('div', gi ? 'hp-grid' + (short ? ' is-brief' : '') : '');
      s.setAttribute('data-g', g.key); keys[g.key] = true; total += g.people.length;
      g.people.forEach(p => { people[p.slug] = p; grid.appendChild(short ? brief(p) : gi ? card(p) : wide(p)); });
      s.appendChild(h); s.appendChild(grid); groups.appendChild(s);
      chip(g.key, g.label);
    });
    function show(g) {
      state.g = keys[g] ? g : '';
      each(nav.children, c => c.setAttribute('aria-current', c.getAttribute('data-g') === state.g ? 'true' : 'false'));
      each(groups.children, s => { s.hidden = !!state.g && s.getAttribute('data-g') !== state.g; });
    }

    /* a profile, and an enlarged photograph: both are dialogs */
    function modal(d) { if (!d.open) { d.showModal(); html.classList.add('hp-lock'); } }
    function unlock() { if (!dlg.open && !lb.open) html.classList.remove('hp-lock'); }
    function hash() { try { return decodeURIComponent(here.hash.slice(1)); } catch (e) { return ''; } }
    function address(h, push) { try { window.history[push ? 'pushState' : 'replaceState'](null, '', h ? '#' + h : here.pathname + here.search); } catch (e) {} }
    function open(p) { if (shown !== p) { dlgBody.textContent = ''; dlgBody.appendChild(profile(p)); shown = p; } modal(dlg); sheet.scrollTop = 0; }
    function light(i) {
      var ph = data.pics[at = (i + data.pics.length) % data.pics.length];
      lbImg.removeAttribute('srcset'); lbImg.removeAttribute('src');
      if (ph.srcset) { lbImg.sizes = '(max-width: 1140px) 96vw, 1100px'; lbImg.srcset = ph.srcset; }
      lbImg.src = ph.src; lbN.textContent = (at + 1) + ' / ' + data.pics.length;
      modal(lb);
    }
    each([dlg, lb], d => d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); }));
    dlg.addEventListener('close', () => {
      var was = shown && hash() === shown.slug;
      unlock();
      if (was) { if (pushed) window.history.back(); else address(state.g, false); }
      pushed = false;
    });
    lb.addEventListener('close', unlock);
    lb.addEventListener('click', e => { var b = e.target.closest('[data-step]'); if (b) light(at + (+b.getAttribute('data-step'))); });
    lb.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') light(at - 1); else if (e.key === 'ArrowRight') light(at + 1); });
    if (data.pics.length < 2) each(lb.querySelectorAll('[data-step], [data-hp="photo-n"]'), b => { b.hidden = true; });

    /* the address: #students shows a group, #subin-kim opens a person */
    function route(first) {
      var h = hash(), p = people[h], c;
      if (!p) { if (dlg.open) dlg.close(); show(h); return; }
      c = document.getElementById('hp-' + p.slug);
      if (first || c.closest('[hidden]')) show('');
      if (p.more) open(p); else if (dlg.open) dlg.close();
      if (first || !p.more) {
        c.scrollIntoView({ block: c.offsetHeight > window.innerHeight * 0.7 ? 'start' : 'center' });
        if (!p.more) { c.classList.add('is-here'); window.setTimeout(() => c.classList.remove('is-here'), 2400); }
      }
    }
    function moved() { pushed = false; route(false); }
    root.addEventListener('click', e => {
      var a = e.target.closest('a[data-open], a[data-g]'), p;
      if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
      e.preventDefault();
      if (a.hasAttribute('data-g')) { show(a.getAttribute('data-g')); address(state.g, false); return; }
      p = people[a.getAttribute('data-open')];
      if (p) { address(p.slug, true); open(p); pushed = true; }
    });
    window.addEventListener('popstate', moved);
    window.addEventListener('hashchange', moved);

    sec.setAttribute('data-hp-old', '');
    root.setAttribute('data-state', 'on');
    root.setAttribute('data-people', total);

    /* the cards rise as they come into view (not for a visitor who asked for reduced motion) */
    if (!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) && 'IntersectionObserver' in window) {
      root.classList.add('hp-anim');
      var io = new IntersectionObserver(es => {
        var n = 0;
        es.forEach(e => {
          var t = e.target;
          if (!e.isIntersecting) return;
          io.unobserve(t);
          t.style.transitionDelay = (n++ % 4) * 70 + 'ms'; t.classList.add('is-in');
          window.setTimeout(() => { t.classList.remove('hp-rise', 'is-in'); t.style.transitionDelay = ''; }, 1200);
        });
      }, { rootMargin: '0px 0px -5% 0px' });
      each(root.querySelectorAll('.hp-rise'), e => io.observe(e));
    }
    route(true);
  }

  /* the page's section is read as soon as the browser has all of it, whether this block comes before or after it */
  var done = false, mo = null;
  function start() {
    if (done) return;
    var c = document.querySelector('.w-tabs .people-card'), tabs = c && c.closest('.w-tabs');
    var sec = tabs ? tabs.closest('.section') || tabs.parentNode : document.querySelector('.section.teachers');
    if (document.readyState === 'loading' && !(sec && sec.nextElementSibling)) return;
    done = true;
    if (mo) mo.disconnect();
    try { if (!sec || !sec.querySelector('.w-tabs')) throw new Error('the People tabs are not on this page'); build(sec); } catch (e) { fail(e); }
  }
  if (document.body) { mo = new MutationObserver(start); mo.observe(document.body, { childList: true }); }
  document.addEventListener('DOMContentLoaded', start);
  start();
})();
</script>
