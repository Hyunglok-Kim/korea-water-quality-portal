<!--
  hydroai.net project pages (/project/...), shown in a cleaner layout by one block.
  The title with who leads the project, the first picture large, the facts as a row of tiles, then the text
  section by section with its figures (a click enlarges one; arrows step through them), the links, and other
  projects of the lab.

  Where it goes: one Webflow Code Embed on the Projects template page, right after the navigation bar.
  It has no content of its own. The title, the date, the text and the pictures are read from the page (the
  project's item in the Projects collection); whose project it is is read from the People page: everyone whose
  card there links to this page as "Main Project Link". Those stay where they are, are edited in Webflow as
  before, and are not shown while this block runs. Without scripts, in a browser from before 2022, or if the
  page cannot be read, the page shows as it always did.

  How a project's text is read (whoever writes one can rely on these):
    the first paragraph                     the opening line under the title
    a heading                               a section; a long heading is set above its text, a short one beside it
    a picture with its caption              a figure; the first one of the page is shown large under the title
    the heading "At a glance", then a list  tiles: "Data: SMAP, ASCAT" (a bold label or the words before the colon)
    in that list, "Status: ..."             the green mark beside the name
    a quote                                 the key sentence, set apart
    the heading "More figures"              its pictures side by side
    the heading "Links", then links         buttons at the foot of the text
    empty lines                             left out
  To change the words on the buttons: T in the script.
-->
<style>
  /* the page's own sections stay on the page (they are edited in Webflow) and are not shown while this block is on */

    --green: #219653; --deep: #14622f; --mint: #75fb92; --card: #fcfbf9; --head: "Plus Jakarta", sans-serif;
    display: none; box-sizing: border-box; padding: 132px 0 96px; font-family: Satoshi, sans-serif; font-size: 16px; line-height: 1.5; color: var(--ink); text-align: left; }

  @media (max-width: 1099px) {

<article class="hj" id="hj-project" aria-labelledby="hj-title">
  <div class="hj-wrap">
    <header class="hj-top" data-hj="top">
      <div class="hj-lead">
        <p class="hj-kicker"><a href="/projects">Projects</a><span data-hj="kind" hidden></span></p>

<script>
(function () {
  'use strict';
  var root = document.getElementById('hj-project'), html = document.documentElement, here = window.location;
  if (!root || root.getAttribute('data-state')) return;
  root.setAttribute('data-state', 'wait');
  /* a browser from before 2022 (no <dialog>) keeps the page as it was */
  if (!window.HTMLDialogElement || !window.MutationObserver) { root.setAttribute('data-state', 'off'); return; }
  html.classList.add('hj-js');      /* from here the page's own sections are not shown; fail() brings them back */

  var T = { main: 'Main project', profile: 'View profile', more: 'More projects', all: 'All projects', contact: 'Contact the lab', zoom: 'Enlarge the figure', full: 'Open full size' };
  var FACTS = /^(at a glance|key facts|facts|in brief)$/i;      /* a heading that begins the tiles */
  var LINKS = /^(links|read more|related links|resources)$/i;   /* a heading that begins the buttons */
  var GRID = /^(more figures|figures|gallery)$/i;               /* a heading whose pictures are set as a grid */
  var STATUS = /^status$/i, MAIN = /main\s+pro\w*\s+link/i;     /* on the People page: "[Main Project Link]", however it is spelt */
  var LONG = 44;      /* a heading longer than this is set above its text instead of beside it */
  var MORE = 6;       /* other projects shown at the foot of the page */

  var C = String.fromCharCode;
  var ZW = new RegExp('[' + C(0x200b) + '-' + C(0x200d) + C(0xfeff) + ']', 'g'), WORD = new RegExp('[^a-z0-9' + C(0xc0) + '-' + C(0xffff) + ']+', 'g');
  var HON = /^((prof|dr|mr|ms|mrs|miss|mx)\.?\s+)+/i;
  var KEEP = { A: 'a', B: 'strong', STRONG: 'strong', I: 'em', EM: 'em', SUP: 'sup', SUB: 'sub', CODE: 'code', BR: 'br' };
  var ZOOM = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
  var clean = function (s) { return (s || '').replace(ZW, '').replace(/\s+/g, ' ').trim(); };
  var slug = function (s) { return clean(s).toLowerCase().replace(WORD, '-').replace(/^-+|-+$/g, ''); };
  var each = function (list, fn) { [].forEach.call(list, fn); };
  var part = function (name) { return root.querySelector('[data-hj="' + name + '"]'); };
  var site = function (h) { return (h || '').replace(/^www\./, ''); };
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function fail(e) {
    html.classList.remove('hj-js', 'hj-lock'); root.setAttribute('data-state', 'off');
    each(document.querySelectorAll('[data-hj-old]'), function (x) { x.removeAttribute('data-hj-old'); });
    if (window.console) console.warn('hydroai project block: the page is shown as it was', e);
  }
  /* the path of an address on this site, or '' for an address elsewhere */
  function path(href) {
    try { var u = new URL(href, here.href); return site(u.hostname) === site(here.hostname) || site(u.hostname) === 'hydroai.net' ? u.pathname.replace(/\/+$/, '') : ''; } catch (e) { return ''; }
  }
  var self = path(here.href);

  /* words with their links and emphasis, and nothing else of the markup they came in */
  function inline(src, into) {
    each(src.childNodes, function (n) {
      var k, e, h, t;
      if (n.nodeType === 3) { t = n.nodeValue.replace(ZW, ''); if (t) into.appendChild(document.createTextNode(t)); return; }
      if (n.nodeType !== 1 || n.tagName === 'FIGCAPTION') return;
      k = KEEP[n.tagName];
      if (!k) { inline(n, into); return; }
      e = el(k);
      if (k === 'a') {
        h = n.getAttribute('href') || '';
        if (!/^(https?:|mailto:|\/|#)/i.test(h)) { inline(n, into); return; }
        e.href = h;
        if (/^https?:/i.test(h) && !path(h)) { e.target = '_blank'; e.rel = 'noopener'; }
      }
      if (k !== 'br') inline(n, e);
      into.appendChild(e);
    });
    return into;
  }

  /* the page's text, piece by piece */
  function figure(n) {
    var img = n.querySelector('img'), fr = n.querySelector('iframe'), cap = n.querySelector('figcaption');
    cap = cap && clean(cap.textContent) ? cap : null;
    if (img && img.getAttribute('src')) return { t: 'fig', src: img.getAttribute('src'), srcset: img.getAttribute('srcset') || '', alt: clean(img.getAttribute('alt')), cap: cap };
    if (fr && /^https:/i.test(fr.getAttribute('src') || '')) return { t: 'video', src: fr.getAttribute('src'), title: clean(fr.getAttribute('title')), cap: cap };
    return null;
  }
  function read(rich) {
    var out = [];
    each(rich.children, function (n) {
      var tag = n.tagName, f;
      if (/^H[1-6]$/.test(tag)) { if (clean(n.textContent)) out.push({ t: 'h', text: clean(n.textContent) }); }
      else if (tag === 'UL' || tag === 'OL') { if (clean(n.textContent)) out.push({ t: 'list', node: n, ord: tag === 'OL' }); }
      else if (tag === 'BLOCKQUOTE') { if (clean(n.textContent)) out.push({ t: 'quote', node: n }); }
      else if (n.querySelector('img, iframe')) { f = figure(n); if (f) out.push(f); }
      else if (clean(n.textContent)) out.push({ t: 'p', node: n });
    });
    return out;
  }
  /* "Data: SMAP, ASCAT": a bold label, or the words before the colon */
  function fact(li, s) {
    var b = li.firstElementChild, first = li.firstChild, label = '', val = el('dd'), c, t, i;
    if (b && /^(B|STRONG)$/.test(b.tagName) && (first === b || (first.nodeType === 3 && !clean(first.nodeValue)))) {
      label = clean(b.textContent).replace(/\s*:\s*$/, '');
      c = li.cloneNode(true); c.removeChild(c.firstElementChild); inline(c, val);
      if (val.firstChild && val.firstChild.nodeType === 3) val.firstChild.nodeValue = val.firstChild.nodeValue.replace(/^\s*:\s*/, '');
    } else {
      t = clean(li.textContent); i = t.indexOf(':');
      if (i > 0 && i < 30) { label = t.slice(0, i); val.textContent = clean(t.slice(i + 1)); } else val.textContent = t;
    }
    if (!clean(val.textContent)) return;
    if (STATUS.test(label)) s.status = clean(val.textContent); else s.facts.push({ label: label, val: val });
  }
  function shape(blocks) {
    var open = { title: '', items: [] }, secs = [open], cur = open, s = { lede: null, facts: [], status: '', links: [], hero: null };
    blocks.forEach(function (b) { if (b.t === 'h') { cur = { title: b.text, items: [] }; secs.push(cur); } else cur.items.push(b); });
    if (open.items.length && open.items[0].t === 'p') s.lede = open.items.shift().node;
    /* the tiles and the buttons take their lists; whatever else stands under those headings stays in the text */
    secs.forEach(function (sec) {
      var facts = FACTS.test(sec.title), links = LINKS.test(sec.title);
      if (!facts && !links) return;
      sec.title = '';
      sec.items = sec.items.filter(function (b) {
        if (facts && b.t === 'list') { each(b.node.children, function (li) { fact(li, s); }); return false; }
        if (links && b.node && b.node.querySelector('a[href]')) { each(b.node.querySelectorAll('a[href]'), function (a) { if (clean(a.textContent)) s.links.push(a); }); return false; }
        return true;
      });
    });
    /* the first picture of the page is shown large under the title */
    secs.some(function (sec) { return sec.items.some(function (b, i) { if (b.t !== 'fig') return false; s.hero = b; sec.items.splice(i, 1); return true; }); });
    s.secs = secs.filter(function (sec) { return sec.items.length; });
    return s;
  }

  var figs = [];      /* every picture of the page in order: the enlarged view steps through them */
  function shot(f, eager) {
    var fig = el('figure', 'hj-fig'), b = el('button', 'hj-shot'), img = el('img'), z = el('span', 'hj-zoom');
    b.type = 'button'; b.setAttribute('data-fig', figs.length); b.setAttribute('aria-label', T.zoom);
    img.alt = f.alt || (f.cap ? clean(f.cap.textContent) : ''); img.decoding = 'async';
    if (!eager) img.loading = 'lazy';
    if (f.srcset) { img.sizes = '(max-width: 1396px) 94vw, 1300px'; img.srcset = f.srcset; }
    img.src = f.src;
    z.innerHTML = ZOOM;
    b.appendChild(img); b.appendChild(z); fig.appendChild(b);
    if (f.cap) fig.appendChild(inline(f.cap, el('figcaption', 'hj-cap')));
    figs.push({ src: f.src, alt: img.alt, cap: f.cap });
    return fig;
  }
  function content(items, into, grid) {
    var row = null;
    items.forEach(function (b) {
      var e = null, w, fr;
      if (b.t === 'fig') {
        if (grid && !row) { row = el('div', 'hj-figs'); into.appendChild(row); }
        (row || into).appendChild(shot(b));
        return;
      }
      row = null;
      if (b.t === 'p') e = inline(b.node, el('p', 'hj-p'));
      else if (b.t === 'quote') e = inline(b.node, el('blockquote', 'hj-quote'));
      else if (b.t === 'list') {
        e = el(b.ord ? 'ol' : 'ul', 'hj-list');
        each(b.node.children, function (li) { if (li.tagName === 'LI' && clean(li.textContent)) e.appendChild(inline(li, el('li'))); });
      } else if (b.t === 'video') {
        e = el('figure', 'hj-fig'); w = el('div', 'hj-video'); fr = el('iframe');
        fr.src = b.src; fr.title = b.title || 'Video'; fr.loading = 'lazy'; fr.allowFullscreen = true;
        fr.setAttribute('allow', 'accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
        w.appendChild(fr); e.appendChild(w);
        if (b.cap) e.appendChild(inline(b.cap, el('figcaption', 'hj-cap')));
      }
      if (e) into.appendChild(e);
    });
  }

  function build(old, post) {
    var rich = post.querySelector('.w-richtext'), h1 = old.querySelector('h1'), title = clean(h1 && h1.textContent);
    if (!rich || !title) throw new Error('the project page has no title or no text');
    var date = clean((old.querySelector('.text-medium') || {}).textContent), bg = /url\((['"]?)(.*?)\1\)/.exec(old.style.backgroundImage || '');
    var s = shape(read(rich)), body = part('body'), meta = part('meta'), list = post.nextElementSibling, cta = post.querySelector('a.cta[href]');
    var others = [], seen = {}, after = 0, e;
    if (!s.hero && bg && bg[2]) s.hero = { src: bg[2], srcset: '', alt: '', cap: null };

    part('title').textContent = title;
    if (s.lede) inline(s.lede, part('lede')); else part('lede').hidden = true;
    if (s.status) meta.appendChild(el('span', 'hj-chip', s.status));
    if (date) meta.appendChild(el('span', 'hj-date', date));
    if (s.hero) { e = part('hero'); e.appendChild(shot(s.hero, true)); e.hidden = false; }
    if (s.facts.length) {
      e = part('facts');
      s.facts.forEach(function (f) { var d = el('div', 'hj-fact'); if (f.label) d.appendChild(el('dt', '', f.label)); d.appendChild(f.val); e.appendChild(d); });
      e.hidden = false; part('top').classList.add('has-facts');
    }
    s.secs.forEach(function (sec) {
      var x = el('section', 'hj-sec hj-rise' + (sec.title ? (sec.title.length > LONG ? ' is-long' : '') : ' is-open')), cnt = el('div', 'hj-cnt');
      if (sec.title) x.appendChild(el('h2', 'hj-h', sec.title));
      content(sec.items, cnt, GRID.test(sec.title));
      x.appendChild(cnt); body.appendChild(x);
    });
    e = part('links');
    s.links.forEach(function (a, i) {
      var p = el('a', 'hj-pill' + (i ? '' : ' is-go'), clean(a.textContent)), h = a.getAttribute('href');
      if (!/^(https?:|mailto:|\/|#)/i.test(h)) return;
      p.href = h; if (/^https?:/i.test(h) && !path(h)) { p.target = '_blank'; p.rel = 'noopener'; }
      e.appendChild(p);
    });
    if (cta && path(cta.getAttribute('href'))) e.appendChild(el('a', 'hj-pill', T.contact)).href = path(cta.getAttribute('href'));
    e.hidden = !e.firstChild;

    /* the other projects: the list at the foot of the page */
    if (list && list.querySelector('.w-dyn-item a[href]')) {
      each(list.querySelectorAll('.w-dyn-item'), function (it) {
        var a = it.querySelector('a[href]'), im = it.querySelector('img'), t = it.querySelector('.text-block-h3-style, h3, h2'), p = a && path(a.getAttribute('href'));
        if (!p || seen[p]) return;
        seen[p] = true;
        if (p === self) { after = others.length; return; }
        if (t && clean(t.textContent)) others.push({ path: p, title: clean(t.textContent), src: im && im.getAttribute('src'), srcset: im && im.getAttribute('srcset') });
      });
      list.setAttribute('data-hj-old', '');
    }
    others = others.slice(after).concat(others.slice(0, after));      /* each page begins with the projects that follow it */

    /* a figure, enlarged */
    var lb = part('lb'), lbImg = lb.querySelector('img'), lbCap = part('lb-cap'), lbN = part('lb-n'), lbFull = part('lb-full'), at = 0;
    function light(i) {
      var f = figs[at = (i + figs.length) % figs.length];
      lbImg.removeAttribute('src'); lbImg.alt = f.alt; lbImg.src = f.src;
      lbCap.textContent = ''; if (f.cap) inline(f.cap, lbCap);
      lbCap.hidden = !f.cap; lbN.textContent = (at + 1) + ' / ' + figs.length; lbFull.href = f.src;
      if (!lb.open) { lb.showModal(); html.classList.add('hj-lock'); }
    }
    lbFull.textContent = T.full;
    root.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-fig], [data-step], [data-close]');
      if (b && b.hasAttribute('data-fig')) light(+b.getAttribute('data-fig'));
      else if (b && b.hasAttribute('data-step')) light(at + (+b.getAttribute('data-step')));
      else if (b || ev.target === lb) lb.close();
    });
    lb.addEventListener('close', function () { html.classList.remove('hj-lock'); });
    lb.addEventListener('keydown', function (ev) { if (ev.key === 'ArrowLeft') light(at - 1); else if (ev.key === 'ArrowRight') light(at + 1); });
    if (figs.length < 2) each(lb.querySelectorAll('[data-step], [data-hj="lb-n"]'), function (b) { b.hidden = true; });

    old.setAttribute('data-hj-old', ''); post.setAttribute('data-hj-old', '');
    root.setAttribute('data-figs', figs.length); root.setAttribute('data-secs', s.secs.length);
    root.setAttribute('data-state', 'on');
    if (/^hydroai$/i.test(clean(document.title))) document.title = title + ' | HydroAI';

    /* the sections rise as they come into view (not for a visitor who asked for reduced motion) */
    if (!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) && 'IntersectionObserver' in window) {
      root.classList.add('hj-anim');
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (x) {
          var t = x.target;
          if (!x.isIntersecting) return;
          io.unobserve(t); t.classList.add('is-in');
          window.setTimeout(function () { t.classList.remove('hj-rise', 'is-in'); }, 1100);
        });
      }, { rootMargin: '0px 0px -6% 0px' });
      each(root.querySelectorAll('.hj-rise'), function (x) { io.observe(x); });
    }

    /* who leads it, and which other projects are somebody's main project: the People page says */
    function people(all) {
      var mine = all[self] || [], box = part('more'), grid = part('grid'), k = part('kind');
      mine.slice().reverse().forEach(function (p) {
        var a = el('a', 'hj-person'), f = el('span', 'hj-face'), t = el('span'), img;
        a.href = '/people#' + p.slug; a.setAttribute('data-person', p.slug);
        if (p.src) { img = el('img'); img.alt = ''; if (p.srcset) { img.sizes = '52px'; img.srcset = p.srcset; } img.src = p.src; f.appendChild(img); }
        if (p.role) t.appendChild(el('span', 'hj-by', p.role));
        t.appendChild(el('span', 'hj-who', p.name)); t.appendChild(el('span', 'hj-role', T.profile));
        a.appendChild(f); a.appendChild(t); meta.insertBefore(a, meta.firstChild);
      });
      if (mine.length) { k.textContent = T.main; k.hidden = false; }
      others.filter(function (o) { return all[o.path]; }).concat(others.filter(function (o) { return !all[o.path]; })).slice(0, MORE).forEach(function (o) {
        var a = el('a', 'hj-card hj-rise'), th = el('span', 'hj-thumb'), t = el('span', 'hj-ct'), img, who = (all[o.path] || []).map(function (p) { return p.name.replace(HON, ''); }).join(', ');
        a.href = o.path;
        if (o.src) { img = el('img'); img.alt = ''; img.loading = 'lazy'; if (o.srcset) { img.sizes = '(max-width: 559px) 94vw, (max-width: 1099px) 46vw, 420px'; img.srcset = o.srcset; } img.src = o.src; th.appendChild(img); }
        if (who) t.appendChild(el('span', 'hj-cby', who));
        t.appendChild(el('span', 'hj-cn', o.title));
        a.appendChild(th); a.appendChild(t); grid.appendChild(a);
        if (root.classList.contains('hj-anim') && io) io.observe(a); else a.classList.remove('hj-rise');
      });
      if (grid.firstChild) { part('more-h').textContent = T.more; part('all').textContent = T.all; box.hidden = false; }
      root.setAttribute('data-people', mine.length);
    }
    function ask() {
      return fetch('/people', { credentials: 'same-origin' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (t) {
        var d = new DOMParser().parseFromString(t, 'text/html'), all = {};
        each(d.querySelectorAll('.people-card'), function (card) {
          var a = [].filter.call(card.querySelectorAll('.w-richtext a[href]'), function (x) { return MAIN.test(x.textContent); })[0], p = a && path(a.getAttribute('href'));
          var h = card.querySelector('.name h2') || card.querySelector('h2'), name = clean(h && h.textContent), img = card.querySelector('.people-image-wrap img');
          if (!p || !name) return;
          (all[p] = all[p] || []).push({ name: name, slug: slug(name.replace(HON, '')), role: clean((card.querySelector('.subtext') || {}).textContent),
            src: img && img.getAttribute('src'), srcset: img && img.getAttribute('srcset') });
        });
        return all;
      });
    }
    (window.fetch && window.DOMParser ? ask() : Promise.reject()).catch(function () { return {}; }).then(people).catch(function () { root.setAttribute('data-people', 0); });
  }

  /* the page is read as soon as the browser has all of it, whether this block comes before or after it */
  var done = false, mo = null;
  function whole(post) {      /* true once something follows the part of the page that holds the project */
    var n = post;
    while (n.parentNode && n.parentNode !== document.body) n = n.parentNode;
    if (n !== post) return !!n.nextElementSibling;
    for (n = post.nextElementSibling; n; n = n.nextElementSibling) if (n.tagName === 'SCRIPT') return true;
    return false;
  }
  function start() {
    if (done) return;
    var old = document.querySelector('.section.project-detail'), post = document.querySelector('.section.project-post-content');
    if (document.readyState === 'loading' && !(post && whole(post))) return;
    done = true;
    if (mo) mo.disconnect();
    try { if (!old || !post) throw new Error('this is not a project page'); build(old, post); } catch (e) { fail(e); }
  }
  if (document.body) { mo = new MutationObserver(start); mo.observe(document.body, { childList: true }); }
  document.addEventListener('DOMContentLoaded', start);
  start();
})();
</script>
