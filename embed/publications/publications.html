<!--
  hydroai.net Publications page, shown as one list that can be searched, by one block.
  A title with the page's quotation, a chip for each of the page's lists and a search field, then the list:
  the journal papers year by year (a row each: picture, title, journal, month, link; a click opens the summary
  with the picture larger, a click on the picture shows it full size), the papers under review with their
  state, and the conference talks by year and meeting. The years stand beside the list, stay in view and lead
  to their year.

  Where it goes: one Webflow Code Embed on the Publications page, the first element of the page.
  It has no content of its own. The entries are read from the CMS lists in the page's three tabs, the
  quotation from the line above the tabs; those stay on the page, are edited in Webflow as before, and are not
  shown while this block runs. The page lists its journal papers a few at a time ("Next"); the block asks for
  the following pages itself. Without scripts, in a browser from before 2022, or if nothing can be read from
  the page, the page shows as it always did.

  To change it:
    a paper, a talk, their order      the collections and the tabs in Webflow
    the names of the lists            the tabs' labels in Webflow
    the quotation                     the line above the tabs in Webflow
    the small title, the title        the markup below
    the words on the buttons          T in the script
  How an entry is read: a link that is "TBD" or "#" is no address yet ("Link soon"); a journal named "-" is
  left out; a list whose entries carry dates is shown by year (talks also by meeting), any other as it stands
  with each entry's last line as a mark; "December 1, 2026" is shown as "Dec 2026", the whole date on
  pointing at it; a line that explains a mark ("* = ...") is shown while an entry carries the mark.
-->
<style>

<script>

      d.kind = 1; d.venue = txt('h4'); d.tail = txt('.publication_date'); d.href = a ? clean(a.getAttribute('href')) : '';

      if (d.who) bit(meta, 'hb-who', d.who);

    }
